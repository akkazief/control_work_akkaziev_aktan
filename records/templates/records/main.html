{% extends "base.html" %}
{% block nav %}
    <a class="nav-link" href="{% url 'create' %}">Добавить запись</a>
{% endblock %}
{% block content %}
    <div class="page-header d-flex justify-content-between align-items-center my-4 p-3">
        <h1>Записи</h1>
    </div>
    <div class="row row-cols-1 row-cols-md-2 g-4">
    {% for record in records %}
        <div class="col">
            <div class="card border-secondary h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold">{{ record.name }}</h6>
                    <small class="text-muted">{{ record.email }}</small>
                </div>
                <div class="card-body text-secondary">
                    <p class="card-text">{{ record.text|linebreaks }}</p>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <h6 class="mb-0">{{ record.created_at }}</h6>
                    <div class="d-flex gap-2">
                        <a href="{% url 'update' record.pk %}" class="btn btn-sm btn-outline-warning">
                            <i class="fa-regular fa-pen-to-square"></i>
                        </a>
                        <a href="{% url 'delete' record.pk %}" class="btn btn-sm btn-outline-danger">
                            <i class="fa-regular fa-trash-can"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    {% empty %}
        <p class="text-muted">Нет записей</p>
    {% endfor %}
</div>

{% endblock %}
